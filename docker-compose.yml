# Woodpecker 生产编排：postgres(pgvector) + redis + api + worker + nginx
# 用法：
#   cp deploy/.env.production.example .env && vim .env   # 必改全部 CHANGE_ME
#   docker compose up -d
#   浏览器打开 http://<host>/ → 注册首个账号（自动成为管理员）
#
# 依赖说明：
#   - 迁移由 api/worker 启动时自动执行（自研 runner：幂等 + advisory lock 并发安全）
#   - api 与 worker 挂同一 uploads 卷（上传暂存 + 摄取读取必须共享）
#   - WORKER_ID 多 worker 必须唯一（缺省主机名，k8s 重建 Pod 场景见运行手册）

name: woodpecker

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-woodpecker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-woodpecker}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woodpecker}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # 不映射宿主机端口：仅 compose 网络内可达（备份走 docker exec）

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 一次性迁移服务已移除（2026-11-26 迁移改自研 runner）：api/worker 启动时自动执行嵌入迁移，
  # 幂等 + advisory lock 多进程并发安全（internal/database），无需独立迁移任务。
  # （历史方案 migrate/migrate CLI 镜像按数字版本号解析文件，无法识别现 schema.up.sql 命名。）

  api:
    build: .
    image: woodpecker-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-woodpecker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-woodpecker}?sslmode=disable
      REDIS_ADDR: redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内访问宿主机模型服务（Ollama 等）
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # api 不直接暴露宿主机端口：统一经 nginx（/api 反代 + 健康检查直通）

  worker:
    build: .
    image: woodpecker-server:latest
    restart: unless-stopped
    command: ["--mode=worker"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-woodpecker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-woodpecker}?sslmode=disable
      REDIS_ADDR: redis:6379
      WORKER_ID: ${WORKER_ID:-worker-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-1}   # 多副本必须各自设置唯一 WORKER_ID（见运行手册）

  nginx:
    build: ./web
    image: woodpecker-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  uploads_data:
