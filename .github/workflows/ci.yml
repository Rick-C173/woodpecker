name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # golangci-lint v2 官方 action；配置读取 .golangci.yml
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  backend:
    runs-on: ubuntu-latest
    services:
      # 集成测试用 PG（pgvector 镜像；POSTGRES_USER 即超级用户，可装扩展）
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: woodpecker
          POSTGRES_PASSWORD: woodpecker
          POSTGRES_DB: woodpecker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woodpecker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 编译验证：先确认全量可构建再跑 vet/测试
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # 集成测试共享同一 PostgreSQL，必须 -p 1 串行（repo 直测与 HTTP 流测试互不踩数据）
      - run: go test -tags=integration -p 1 ./...
        env:
          TEST_DSN: postgres://woodpecker:woodpecker@localhost:5432/woodpecker?sslmode=disable

  # M4 风险前置：tree-sitter 绑定依赖 cgo，先用独立模块冒烟验证（不影响主模块构建）
  cgo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cgo-smoke/go.mod
      - run: go build ./...
        working-directory: tools/cgo-smoke
      - run: go run .
        working-directory: tools/cgo-smoke

