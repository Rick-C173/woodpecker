services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: woodpecker-pg
    environment:
      POSTGRES_USER: woodpecker
      POSTGRES_PASSWORD: woodpecker
      POSTGRES_DB: woodpecker
    ports:
      - "5433:5432" # 宿主机 5432 被原生 PostgreSQL 服务占用，dev 库映射到 5433
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodpecker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: woodpecker-redis
    ports:
      - "6380:6379" # 宿主机 6379 被本机其他 Redis 占用，dev 库映射到 6380
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
