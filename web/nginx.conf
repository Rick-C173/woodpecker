# Woodpecker 前端 nginx 配置：
# - SPA 静态托管（react-router history 模式回退 index.html）
# - /api 反代到 api 容器；SSE 流式直通（proxy_buffering off 是关键）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态产物：强缓存（文件名变更即失效）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：同源部署，前端用相对路径 /api/v1，绕开 CORS
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # SSE 关键：关闭缓冲 + 长读超时 + 空连接头（避免 60s 断流）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;   # 上传：单文件 ≤5MB，单次最多 50 个
    }

    # 健康检查直通（宿主机探活用）
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}
